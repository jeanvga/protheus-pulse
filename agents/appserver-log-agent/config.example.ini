; Configuração do agente de log do Protheus Pulse.
; Copie para pulse-agent.ini, ajuste os valores e guarde o arquivo em uma pasta
; que só o administrador consiga ler: os tokens ficam aqui em texto puro.

[pulse]
; Endereço do Pulse. Se o agente roda no mesmo servidor, 127.0.0.1 já basta.
base_url = http://127.0.0.1:5058

; Intervalo entre as leituras do log, em segundos (mínimo 10).
interval_seconds = 60

; Tempo limite de cada envio, em segundos.
timeout_seconds = 15

; Só vale quando base_url é https. Desligue apenas em laboratório.
verify_tls = true
; ca_bundle = C:\ProgramData\ProtheusPulse\certs\ca.pem

; Onde o agente guarda o cursor de leitura de cada log. Sem esse arquivo ele
; recomeça do fim do log na próxima execução.
state_file = pulse-agent-state.json

; Log do próprio agente (rotaciona sozinho em 5 MB, mantendo 3 arquivos).
log_file = pulse-agent.log

; Quanto do log é lido por ciclo. Protege contra um arquivo que cresceu demais.
max_bytes_per_cycle = 262144

; Máximo de mensagens distintas enviadas por ciclo (o Pulse aceita até 200).
max_events_per_cycle = 200

; Avisos costumam ser ruído em produção; ligue se quiser recebê-los também.
send_warnings = false

; Uma seção por AppServer monitorado. O nome depois de "agent:" identifica o
; alvo no estado e nas mensagens do log; escolha algo estável.
; agent_key e token vêm da aba Configurações do Pulse, em "Agentes de log".
; O token aparece uma única vez, na criação.
[agent:erp-producao]
agent_key = agt_COLE_A_CHAVE_AQUI
token = COLE_O_TOKEN_AQUI
log_path = D:\TOTVS\Protheus\appserver\console.log
; O console.log do Protheus no Windows costuma ser CP1252.
encoding = cp1252

; [agent:erp-homologacao]
; agent_key = agt_OUTRA_CHAVE
; token = OUTRO_TOKEN
; log_path = D:\TOTVS\ProtheusHml\appserver\console.log
; encoding = cp1252
